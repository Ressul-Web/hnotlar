<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H-NOTLAR | Admin Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="giris-logo">
      <span class="logo-nokta"></span>
      <h1>H-<span class="logo-vurgu">NOTLAR</span></h1>
    </div>
    <div class="admin-kullanici">
      <span id="girisYapanAdSoyad"></span>
      <button id="cikisButonu" class="ikincil-buton">Çıkış</button>
    </div>
  </header>

  <nav class="admin-tabs">
    <button class="tab-buton aktif" data-tab="projeler">Projeler</button>
    <button class="tab-buton" data-tab="kullanicilar">Kullanıcılar</button>
  </nav>

  <main class="admin-icerik">
    <section id="tab-projeler" class="tab-panel aktif">
      <div id="projeListesiGorunumu">
        <div class="panel-baslik-satiri">
          <h2>Projeler</h2>
          <button id="yeniProjeAcButonu" class="birincil-buton"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Yeni Proje</button>
        </div>
        <div id="yeniProjeFormu" class="form-kutusu gizli">
          <input type="text" id="yeniProjeAd" placeholder="Proje adı" />
          <textarea id="yeniProjeAciklama" placeholder="Açıklama (opsiyonel)"></textarea>
          <div class="form-buton-satiri">
            <button id="yeniProjeKaydetButonu" class="birincil-buton">Kaydet</button>
            <button id="yeniProjeIptalButonu" class="ikincil-buton">İptal</button>
          </div>
        </div>
        <div id="projeListesi" class="kart-listesi"></div>
      </div>

      <div id="projeDetayGorunumu" class="gizli">
        <button id="projeyeGeriDonButonu" class="geri-buton"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Projelere dön</button>
        <div class="detay-baslik-satiri">
          <h2 id="projeDetayBaslik"></h2>
          <div class="detay-baslik-aksiyonlar">
            <button id="projeDuzenleButonu" class="duzenle-buton" title="Projeyi düzenle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
            <button id="projeSilButonu" class="tehlike-metin-buton">Sil</button>
          </div>
        </div>
        <p id="projeDetayAciklama" class="aciklama-metni"></p>

        <div class="detay-bolum">
          <div class="panel-baslik-satiri">
            <h3>Atanan Kullanıcılar</h3>
          </div>
          <div id="atananKullanicilar" class="atanan-liste"></div>
          <div class="atama-satiri">
            <select id="kullaniciAtaSecim" class="secim-kutusu"></select>
            <button id="kullaniciAtaButonu" class="ikincil-buton">Ata</button>
          </div>
        </div>

        <div class="detay-bolum">
          <div class="panel-baslik-satiri">
            <h3>Revizyonlar</h3>
            <button id="yeniRevizyonAcButonu" class="birincil-buton"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Yeni Revizyon</button>
          </div>
          <div id="yeniRevizyonFormu" class="form-kutusu gizli">
            <input type="text" id="yeniRevizyonBaslik" placeholder="Revizyon başlığı" />
            <textarea id="yeniRevizyonAciklama" placeholder="Açıklama (opsiyonel)"></textarea>
            <div class="form-buton-satiri">
              <button id="yeniRevizyonKaydetButonu" class="birincil-buton">Kaydet</button>
              <button id="yeniRevizyonIptalButonu" class="ikincil-buton">İptal</button>
            </div>
          </div>
          <div id="revizyonListesi" class="kart-listesi"></div>
        </div>
      </div>

      <div id="revizyonDetayGorunumu" class="gizli">
        <button id="revizyonaGeriDonButonu" class="geri-buton"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Revizyonlara dön</button>
        <div class="detay-baslik-satiri">
          <h2 id="revizyonDetayBaslik"></h2>
          <div class="detay-baslik-aksiyonlar">
            <label class="yayin-kontrolu">
              Kullanıcılara göster
              <span class="anahtar">
                <input type="checkbox" id="revizyonYayinAnahtari" />
                <span class="anahtar-kaydirici"></span>
              </span>
            </label>
            <button id="revizyonDuzenleButonu" class="duzenle-buton" title="Revizyonu düzenle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
            <button id="revizyonSilButonu" class="tehlike-metin-buton">Sil</button>
          </div>
        </div>
        <p id="revizyonDetayAciklama" class="aciklama-metni"></p>

        <div class="panel-baslik-satiri">
          <h3>Maddeler</h3>
          <button id="yeniMaddeAcButonu" class="birincil-buton"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Yeni Madde</button>
        </div>
        <div id="yeniMaddeFormu" class="form-kutusu gizli">
          <input type="text" id="yeniMaddeBaslik" placeholder="Madde başlığı" />
          <textarea id="yeniMaddeMetin" placeholder="Madde içeriği (detay metni)"></textarea>
          <input type="url" id="yeniMaddeMedyaUrl" placeholder="Görsel/Video URL (opsiyonel)" />
          <select id="yeniMaddeMedyaTipi">
            <option value="">Medya yok</option>
            <option value="gorsel">Görsel</option>
            <option value="video">Video</option>
            <option value="metin">Ek Metin/Dosya</option>
          </select>
          <div class="form-buton-satiri">
            <button id="yeniMaddeKaydetButonu" class="birincil-buton">Kaydet</button>
            <button id="yeniMaddeIptalButonu" class="ikincil-buton">İptal</button>
          </div>
        </div>
        <div id="maddeListesi" class="madde-listesi"></div>
      </div>
    </section>

    <section id="tab-kullanicilar" class="tab-panel">
      <div class="panel-baslik-satiri">
        <h2>Kullanıcılar</h2>
        <button id="yeniKullaniciAcButonu" class="birincil-buton"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Yeni Kullanıcı</button>
      </div>
      <div id="yeniKullaniciFormu" class="form-kutusu gizli">
        <input type="text" id="yeniKullaniciAdi" placeholder="Kullanıcı adı" />
        <input type="password" id="yeniKullaniciSifre" placeholder="Şifre" />
        <input type="text" id="yeniKullaniciAdSoyad" placeholder="Ad Soyad" />
        <select id="yeniKullaniciRol">
          <option value="personel">Personel</option>
          <option value="firma">Firma</option>
          <option value="patron">Patron</option>
          <option value="admin">Admin</option>
        </select>
        <input type="text" id="yeniKullaniciFirmaAdi" placeholder="Firma adı" class="gizli" />
        <textarea id="yeniKullaniciAciklama" placeholder="Açıklama (opsiyonel)"></textarea>
        <div class="form-buton-satiri">
          <button id="yeniKullaniciKaydetButonu" class="birincil-buton">Kaydet</button>
          <button id="yeniKullaniciIptalButonu" class="ikincil-buton">İptal</button>
        </div>
      </div>
      <div id="kullaniciTablo" class="tablo-kutusu"></div>
    </section>
  </main>

  <p id="genelHataMesaji" class="genel-hata gizli"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/oturum.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
