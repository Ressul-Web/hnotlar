<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hnotlar | Giriş</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="giris-body">
  <div class="giris-wrapper">
    <div class="giris-card">
      <div class="giris-logo">
        <span class="logo-nokta"></span>
        <h1>hnotlar</h1>
      </div>
      <p class="giris-alt-baslik">Görüşme notlarınızı ve iş takibinizi tek yerden yönetin.</p>

      <form id="girisForm" class="giris-form">
        <div class="form-grup">
          <label for="kullaniciAdi">Kullanıcı Adı</label>
          <input type="text" id="kullaniciAdi" name="kullaniciAdi" placeholder="Kullanıcı adınızı girin" autocomplete="username" />
        </div>

        <div class="form-grup">
          <label for="sifre">Şifre</label>
          <input type="password" id="sifre" name="sifre" placeholder="Şifrenizi girin" autocomplete="current-password" />
        </div>

        <p id="hataMesaji" class="giris-hata"></p>

        <button type="submit" class="giris-buton">Giriş Yap</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/giris.js"></script>
</body>
</html>
